<!--
  הגדרה חד-פעמית (GitHub Pages)
  1) צור ריפו ציבורי נפרד לתפריט (למשל yoko-menu) והעלה אליו את הקובץ הזה בשם index.html.
  2) Settings > Pages > Deploy from a branch > main > /(root).
  3) צור טוקן: GitHub > Settings > Developer settings > Personal access tokens > Fine-grained tokens.
     Repository access: Only select repositories > רק ריפו התפריט. Permissions > Contents: Read and write.
  4) פתח את כתובת התפריט עם #admin בסופה (למשל https://USER.github.io/yoko-menu/#admin), הדבק את הטוקן והתחבר.
  הקובץ menu.json נוצר בשמירה הראשונה, ותמונות חדשות נשמרות בתיקייה menu-img.
  שינוי מופיע ללקוחות כדקה אחרי השמירה.
  מחוץ ל-GitHub Pages הדף רץ במצב הדגמה (הנתונים נשמרים רק בדפדפן).
-->
<style>
  :root {
    --brand: #59b645;
    --brand-ink: #2c7a1f;
    --bg: #f6f8f5;
    --surface: #ffffff;
    --fg: #101410;
    --muted: #55605a;
    --line: #d6ddd6;
    --tag-bg: #e6f2e2;
    --hot: #c4291c;
    --photo-border: #111111;
    --font: "Rubik", "Heebo", "Arial Hebrew", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d0b; --surface: #151915; --fg: #f1f4f0; --muted: #9aa69d; --line: #2a312a;
      --brand-ink: #7fd36b; --tag-bg: #1b2a19; --hot: #ff6b5e; --photo-border: #3a433a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }
  .page { max-width: 680px; margin-inline: auto; }
  .gutter { padding-inline: 16px; }

  .top { background: #000; color: #fff; text-align: center; padding-top: 28px; }
  .logo { display: block; width: 168px; height: auto; margin-inline: auto; }
  .hero { display: block; width: 100%; height: auto; aspect-ratio: 900 / 624; object-fit: cover; margin-top: 20px; }
  .hero-note { background: #000; color: #cfd6cf; font-size: 13px; padding: 8px 16px; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; padding: 14px 16px; background: #fff; color: #111; font-size: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .ico { width: 18px; height: 18px; flex: none; }

  .rail { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-size: 15px; font-weight: 500; cursor: pointer; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); }
  .chip[aria-current="true"] { background: var(--brand); border-color: var(--brand); color: #07210a; font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 14px 0; }
  .filters > span { font-size: 14px; color: var(--muted); }
  .filter { font-size: 14px; cursor: pointer; padding: 4px 12px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
  .filter[aria-pressed="true"] { border-color: var(--brand); background: var(--tag-bg); color: var(--brand-ink); font-weight: 600; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  section { padding-top: 34px; scroll-margin-top: 62px; }
  .brush {
    display: block; width: fit-content; max-width: 100%; margin: 0 auto 6px; padding: 7px 44px; text-align: center;
    font-size: 24px; font-weight: 500; color: #fff; line-height: 1.2; text-wrap: balance;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 46' preserveAspectRatio='none'><path d='M8 13 C45 4 95 9 160 6 S280 3 313 10 L319 17 L310 23 L317 31 C282 41 205 37 150 40 S52 43 11 37 L2 29 L10 22 Z' fill='%2359b645'/></svg>") center / 100% 100% no-repeat;
  }
  .note { text-align: center; color: var(--muted); font-size: 15px; margin: 6px 0 0; }
  h3 { font-size: 18px; font-weight: 600; margin: 26px 0 4px; text-align: center; }
  .sizes { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; }
  .size { font-weight: 600; font-size: 15px; padding: 3px 14px; border-radius: 6px; background: var(--tag-bg); color: var(--brand-ink); font-variant-numeric: tabular-nums; }

  .list { display: grid; gap: 12px; margin-top: 14px; }
  .card { display: flex; gap: 12px; align-items: stretch; background: var(--surface); border: 2px solid var(--brand); padding: 10px; }
  .card .ph { flex: none; width: 104px; align-self: flex-start; aspect-ratio: 4 / 3; object-fit: cover; border: 2px solid var(--photo-border); display: block; }
  .card .body { flex: 1; min-width: 0; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 600; font-size: 17px; line-height: 1.3; min-width: 0; }
  .leader { flex: 1; border-bottom: 2px dotted var(--line); transform: translateY(-4px); min-width: 10px; }
  .price { font-weight: 700; white-space: nowrap; color: var(--brand-ink); font-variant-numeric: tabular-nums; }
  .desc { margin: 3px 0 0; font-size: 14.5px; color: var(--muted); line-height: 1.45; }
  .var { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 14px; }
  .var span { white-space: nowrap; }
  .var b { color: var(--brand-ink); font-variant-numeric: tabular-nums; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--tag-bg); color: var(--brand-ink); }
  .tag.hot { color: var(--hot); background: transparent; border: 1px solid var(--hot); }
  .tag.sold { color: #fff; background: var(--hot); border: 1px solid var(--hot); }
  .tag.hid { color: var(--muted); background: transparent; border: 1px dashed var(--muted); }
  .dim { opacity: .55; }

  .plain { display: grid; margin-top: 4px; }
  .plain .item { padding-block: 11px; border-bottom: 1px solid var(--brand); }
  .plain .item:last-child { border-bottom: 0; }
  .plain .name { font-size: 16px; }

  .group { margin-top: 16px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .group h4 { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--brand-ink); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { font-size: 14px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .opt b { color: var(--brand-ink); font-weight: 600; margin-inline-start: 4px; font-variant-numeric: tabular-nums; }

  .deal { display: flex; gap: 14px; align-items: center; background: var(--brand); color: #07210a; padding: 14px; margin-top: 14px; }
  .deal img { flex: none; width: 112px; aspect-ratio: 4 / 3; object-fit: cover; border: 2px solid #000; display: block; }
  .deal .name { font-size: 22px; font-weight: 700; }
  .deal .leader { border-bottom-color: rgba(0,0,0,.35); }
  .deal .price { color: #07210a; font-size: 22px; }
  .deal p { margin: 6px 0 0; font-size: 14.5px; color: #0c2d10; }

  .tbl { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .tbl th, .tbl td { padding: 10px 6px; text-align: start; border-bottom: 1px solid var(--brand); }
  .tbl th { font-weight: 600; font-size: 14px; color: var(--muted); border-bottom-width: 2px; }
  .tbl td:not(:first-child), .tbl th:not(:first-child) { text-align: center; }
  .tbl td:not(:first-child) { font-weight: 700; color: var(--brand-ink); }
  .poke-prices { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 15px; }
  .poke-prices b { color: var(--brand-ink); }
  .drinks { display: grid; margin-top: 12px; }
  .drinks .drow { padding-block: 9px; border-bottom: 1px solid var(--line); }
  .drinks .drow:last-child { border-bottom: 0; }
  .empty { padding-block: 44px; text-align: center; color: var(--muted); }

  footer { margin-top: 48px; background: #000; color: #cfd6cf; text-align: center; padding: 28px 16px 36px; font-size: 14px; }
  footer img { width: 96px; height: auto; display: block; margin: 0 auto 10px; }
  .admin-link { margin-top: 18px; display: inline-block; background: none; border: 0; color: #6c756e; font-size: 12px; cursor: pointer; padding: 6px 10px; }

  /* ניהול */
  body.has-bar { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .sec-tools { justify-content: center; margin: 8px 0 0; }
  .tbtn { font-size: 13px; padding: 5px 11px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer; }
  .tbtn.on { background: var(--tag-bg); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .tbtn.warn.on { background: var(--hot); border-color: var(--hot); color: #fff; }
  .tbtn.add { border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .notice { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--tag-bg); color: var(--fg); font-size: 14px; }
  .langbar { direction: rtl; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 14px 16px 2px; background: #000; }
  .lang { font: inherit; font-size: 14px; padding: 5px 14px; border-radius: 999px; border: 1.5px solid #38423a; background: transparent; color: #dfe6df; cursor: pointer; }
  .lang[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #07210a; font-weight: 600; }
  .trrow { margin-bottom: 12px; }
  .trrow .he { font-size: 14px; color: var(--muted); margin: 0 0 4px; direction: rtl; text-align: right; }
  .trrow input, .trrow textarea { width: 100%; font: inherit; font-size: 16px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  .trrow.miss input, .trrow.miss textarea { border-color: var(--hot); }
  .trrow textarea { min-height: 64px; resize: vertical; }
  .trbox { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); display: grid; gap: 5px; font-size: 13.5px; line-height: 1.4; }
  .trline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .trtag { flex: none; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--tag-bg); color: var(--brand-ink); }
  .trn { font-weight: 600; }
  .trd { color: var(--muted); }
  .trmiss { color: var(--hot); }
  .abar { position: fixed; inset-inline: 0; bottom: 0; z-index: 20; background: #000; color: #fff; display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .abar .tbtn { flex: none; background: #1d231d; border-color: #38423a; color: #fff; }
  .abar .tbtn.add { border-color: var(--brand); color: #9be585; }
  .abar .state { flex: none; align-self: center; font-size: 13px; color: #9be585; padding-inline: 4px; }
  .backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); color: var(--fg); width: 100%; max-width: 680px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; }
  .fld { margin-bottom: 14px; }
  .fld > label, .fld > .lbl { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
  .fld input[type=text], .fld input[type=email], .fld input[type=password], .fld textarea, .fld select {
    width: 100%; font: inherit; font-size: 16px; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg);
  }
  .fld textarea { min-height: 76px; resize: vertical; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #07210a; font-weight: 600; }
  .rows { display: grid; gap: 8px; }
  .rrow { display: flex; gap: 6px; align-items: center; }
  .rrow input { min-width: 0; flex: 1; }
  .rrow input.num { flex: 0 0 82px; text-align: center; }
  .rrow .x { flex: none; width: 34px; height: 36px; border: 1.5px solid var(--line); border-radius: 8px; background: transparent; color: var(--hot); font-size: 18px; cursor: pointer; }
  .gbox { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; display: grid; gap: 8px; }
  .imgpick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .imgpick img { width: 96px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
  .imgpick .st { font-size: 13px; color: var(--muted); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .btn { font-size: 16px; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #07210a; flex: 1; }
  .btn.danger { color: var(--hot); border-color: var(--hot); }
  .btn.danger.armed { background: var(--hot); color: #fff; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .err { color: var(--hot); font-size: 14px; min-height: 20px; margin: 0 0 8px; }
  #toast { position: fixed; inset-inline: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; justify-content: center; pointer-events: none; }
  #toast span { background: #111; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>

  </footer>
</div>
<div class="abar" id="abar" hidden></div>

<div id="sheetRoot"></div>

<script type="module">

  async function compress(file, max) {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((res) => c.toBlob(res, "image/jpeg", 0.82));
  }

    const file = el("input"); file.type = "file"; file.accept = "image/*"; file.hidden = true;
    const pick = el("button", "tbtn", "בחירת תמונה"); pick.type = "button"; pick.addEventListener("click", () => file.click());
    const rm = el("button", "tbtn", "הסרת תמונה"); rm.type = "button";
    function paint() { const s = imgSrc(cur); prev.hidden = !s; if (s) prev.src = s; rm.hidden = !s; }
    rm.addEventListener("click", () => { cur = undefined; paint(); });
    const api = { el: w, busy: null, get: () => cur };
    file.addEventListener("change", () => {
      const f = file.files && file.files[0]; if (!f) return;
      st.textContent = "מעלה תמונה...";
      api.busy = (async () => {
        try { const blob = await compress(f, 800); const b = await backendReady; if (!b) throw new Error("no backend"); cur = await b.upload(blob); st.textContent = "התמונה הועלתה"; paint(); }
        catch (e) { console.warn(e); st.textContent = "העלאת התמונה נכשלה"; }
        finally { api.busy = null; }
      })();
    });
    box.appendChild(prev); box.appendChild(pick); box.appendChild(rm); box.appendChild(st); box.appendChild(file);
    paint();
    return api;
  }

  }

  // ===== הפעלה =====
  [["v", "צמחוני"], ["vg", "טבעוני"], ["gf", "ללא גלוטן"]].forEach((k) => {
    const b = el("button", "filter", k[1]); b.type = "button"; b.dataset.ui = k[0]; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => { active[k[0]] = !active[k[0]]; b.setAttribute("aria-pressed", active[k[0]] ? "true" : "false"); render(); });
    $("filters").appendChild(b);
  });
  window.addEventListener("scroll", () => spy(false), { passive: true });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetOpen) closeSheet(); });

  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
  render();
  backendReady.then((b) => {
    if (!b) return;
    b.subscribe((m) => {
      if (admin || m === undefined) return;
      if (m === null) { cloudMissing = true; } else {
        cloudMissing = false; menu = normalize(m);
        try { localStorage.setItem("yoko_menu_cache", JSON.stringify(menu)); } catch (e) { /* ignore */ }
      }
      if (!sheetOpen) render();
    });
    b.onAuth(async (u) => {
      admin = !!u;
      if (admin && b.fetchLatest) {
        try { const m = await b.fetchLatest(); if (m) { menu = normalize(m); cloudMissing = false; } else cloudMissing = true; }
        catch (e) { console.warn(e); toast("לא הצלחתי לטעון את התפריט העדכני"); }
      }
      if (!admin) preview = false;
      updateBar(); render();
    });
  });
  const openAdmin = () => backendReady.then(async (b) => {
    if (!b || admin) return;
    if (b.hasToken && b.hasToken()) { try { await b.login(); return; } catch (e) { console.warn(e); } }
    loginSheet();
  });
  // מצב ניהול: #admin, ‎?admin, או כשהאפליקציה מותקנת ופועלת כ-PWA (רק המנהל מתקין אותה)
  const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const wantsAdmin = () => location.hash === "#admin" || /(^|[?&])admin(=|&|$)/.test(location.search) || isStandalone();
  if (wantsAdmin()) openAdmin();
  window.addEventListener("hashchange", () => { if (wantsAdmin()) openAdmin(); });
</script>
</body>
</html>
